# Publicação no Render (https://render.com) — ambiente de DEMONSTRAÇÃO com dados fictícios.
# No plano gratuito o disco não é permanente: os dados voltam ao estado inicial quando o serviço reinicia.
services:
  - type: web
    name: neuro-sistema
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: NEUROSISTEMA_DEMO
        value: "1"
      - key: NEUROSISTEMA_MASTER_KEY
        generateValue: true
      - key: NEUROSISTEMA_DEMO_SENHA
        sync: false
